     One self-contained file. No Wix, no Velo, no CMS — all content is baked in.
     It renders the whole bilingual page: ع/En toggle → Semester Activities (with
     PDF downloads) → Ask Tilli (WhatsApp + QR) → Timeline + Certification →
     Teacher FAQs (with QR) → Important links.

     HOW TO ADD IT TO YOUR SITE  (pick whichever your builder supports):
       A) Host this file somewhere and point an "Embed URL / iFrame" element at it.
       B) Paste the whole file into a "Custom HTML / Code Embed" block that renders
          code in an iframe (Squarespace Code Block, Framer Embed, etc.).

         colours from your host page so nothing leaks either way.

    {number:28, semester:2, nameEn:"Gratitude Cards",                   nameAr:"بطاقات الامتنان",                 pdfUrl:PDF+"28-gratitude-cards.pdf"},
    {number:29, semester:2, nameEn:"A Round of Whispers",               nameAr:"جولة الهمسات",                    pdfUrl:PDF+"29-a-round-of-whispers.pdf"},
    {number:30, semester:2, nameEn:"Don't Wake The Dragon",             nameAr:"لا توقظ التنين",                  pdfUrl:PDF+"30-dont-wake-the-dragon.pdf"},
    {number:31, semester:2, nameEn:"Draw a Puzzle",                     nameAr:"ارسم لعبة الأحجية (Puzzle)",      pdfUrl:PDF+"31-draw-a-puzzle.pdf"},
    {number:32, semester:2, nameEn:"Hug, Hello, High 5",                nameAr:"عناق، تحيّة، أو كفك بكفي عاليًا", pdfUrl:PDF+"32-hug-hello-high-5.pdf"},
    {number:33, semester:2, nameEn:"Duck, Duck, Goose",                 nameAr:"بطة، بطة، إوزة",                  pdfUrl:PDF+"33-duck-duck-goose.pdf"},
    {number:34, semester:2, nameEn:"Saan's Story",                      nameAr:"قصة سند",                         pdfUrl:PDF+"34-saans-story.pdf"},
    {number:35, semester:2, nameEn:"Party List",                        nameAr:"قائمة الحفلة",                    pdfUrl:PDF+"35-party-list.pdf"},
    {number:36, semester:2, nameEn:"Class Party",                       nameAr:"حفلة الصف",                       pdfUrl:PDF+"36-class-party.pdf"}
  ];

  var FAQS=[
    {order:1, widget:"teacherGuide", qEn:"Where can I find the Teacher Guide?", qAr:"أين أجد دليل المعلّم؟", aEn:"You can find the Teacher Guide here:", aAr:"يمكنك العثور على دليل المعلّم هنا:"},
    {order:2, widget:"", qEn:"What is the goal for the programme?", qAr:"ما هو هدف البرنامج؟", aEn:"Complete Lessons 1 to 18 by the end of February and Lessons 19 to 36 by the end of July.", aAr:"إكمال الدروس من 1 إلى 18 بحلول نهاية فبراير، والدروس من 19 إلى 36 بحلول نهاية يوليو."},
    {order:3, widget:"", qEn:"Do I have to follow the lesson exactly?", qAr:"هل يجب أن أتّبع الدرس حرفيًا؟", aEn:"Not necessarily. Contextualise the lesson for your classroom. You know your classroom and your children best. Keep the main learning goal in mind while adapting the activity to suit your children.", aAr:"ليس بالضرورة. كيّف الدرس بما يناسب صفّك؛ فأنت الأدرى بصفّك وأطفالك. حافظ على هدف التعلّم الأساسي مع تعديل النشاط بما يلائم أطفالك."},
    {order:4, widget:"", qEn:"What if I don't have the materials I need?", qAr:"ماذا أفعل إذا لم تتوفّر لديّ المواد اللازمة؟", aEn:"Use a simple alternative that works for the same activity and learning goal.", aAr:"استخدم بديلاً بسيطًا يحقّق النشاط وهدف التعلّم نفسه."},
    {order:5, widget:"", qEn:"How do I know if a child has understood the skill?", qAr:"كيف أعرف أنّ الطفل قد أتقن المهارة؟", aEn:"Look for whether the child can do the skill without help, especially when the example or activity changes.\n\nFor example, if a lesson is helping children identify and name emotions, a child may first identify happy and sad using pictures. Later, you could ask, “How do you think this child is feeling?” when looking at a different picture or situation. If the child can identify the emotion without help, this shows they are beginning to use the skill independently.", aAr:"لاحظ ما إذا كان الطفل قادرًا على أداء المهارة دون مساعدة، خاصةً عند تغيّر المثال أو النشاط.\n\nعلى سبيل المثال، إذا كان الدرس يساعد الأطفال على تمييز المشاعر وتسميتها، فقد يميّز الطفل في البداية مشاعر الفرح والحزن باستخدام الصور. ولاحقًا يمكنك أن تسأل: «كيف تظنّ أنّ هذا الطفل يشعر؟» عند النظر إلى صورة أو موقف مختلف. فإذا استطاع الطفل تحديد الشعور دون مساعدة، دلّ ذلك على أنّه بدأ يستخدم المهارة باستقلالية."},
    {order:6, widget:"", qEn:"What if I miss a lesson?", qAr:"ماذا لو فاتني درس؟", aEn:"The goal is to complete all 36 lessons by the end of July. If you fall behind, speak to the Tilli or school lead about how to catch up.", aAr:"الهدف هو إكمال جميع الدروس الـ36 بحلول نهاية يوليو. وإذا تأخّرت، تحدّث مع مسؤول تيلي أو مسؤول المدرسة حول كيفية تعويض ما فاتك."},
    {order:7, widget:"", qEn:"Can I adapt an activity?", qAr:"هل يمكنني تعديل النشاط؟", aEn:"Yes. Adapt the activity to suit your classroom, while keeping the main learning goal in mind.", aAr:"نعم. عدّل النشاط بما يناسب صفّك مع الحفاظ على هدف التعلّم الأساسي."},
    {order:8, widget:"askTilli", qEn:"What if I have a question or need help?", qAr:"ماذا أفعل إذا كان لديّ سؤال أو احتجت إلى مساعدة؟", aEn:"Ask Tilli is here to guide you through the Teaching Assistant. Use it to ask questions, get ideas and find support while teaching.", aAr:"«اسأل تيلي» موجود لإرشادك عبر المساعد التعليمي. استخدمه لطرح الأسئلة والحصول على الأفكار والدعم أثناء التدريس."},
    {order:9, widget:"", qEn:"What do I need to complete for my certification?", qAr:"ما الذي يجب إكماله للحصول على الشهادة؟", aEn:"You need to complete the Pre-training Survey, all 36 lessons and the Post-intervention Survey.", aAr:"عليك إكمال استمارة ما قبل التدريب، وجميع الدروس الـ36، واستمارة ما بعد التدخّل."}
  ];

  var LINKS=[
    {order:1, nameEn:"Pre-training form",       nameAr:"استمارة ما قبل التدريب", url:"https://forms.gle/yQigSJbqAodcRCNM6"},
    {order:2, nameEn:"ABCDE cards",             nameAr:"بطاقات ABCDE",           url:"https://drive.google.com/file/d/1JQKfSuNF-FaOVZxFPt2Iogh0J_VHw_GS/view?usp=share_link"},
    {order:4, nameEn:"Emotion cards",           nameAr:"بطاقات المشاعر",         url:"https://drive.google.com/file/d/1u6iFHZ6VvLwYs83RKw3AeEBT9cqqhFvT/view?usp=share_link"},
    {order:5, nameEn:"Classroom Observation",   nameAr:"الملاحظة الصفية",        url:"https://drive.google.com/file/d/1jyau6ci_v_ECkfmPnOseE-anJ4ON6j56/view?usp=share_link"}
  ];

  var STAGES=[
    {when_en:"September", when_ar:"سبتمبر", what_en:"Complete the Pre-training Survey", what_ar:"إكمال استمارة ما قبل التدريب", url:"https://bit.ly/479mZRr"},
    {when_en:"October to February", when_ar:"من أكتوبر إلى فبراير", what_en:"Complete Lessons 1 to 18", what_ar:"إكمال الدروس من 1 إلى 18", goal_en:"Goal: Finish the first 18 lessons by the end of February", goal_ar:"الهدف: إنهاء الدروس الـ18 الأولى بحلول نهاية فبراير"},
    {when_en:"March to July", when_ar:"من مارس إلى يوليو", what_en:"Complete Lessons 19 to 36", what_ar:"إكمال الدروس من 19 إلى 36", goal_en:"Goal: Finish Lessons 19 to 36 by the end of July", goal_ar:"الهدف: إنهاء الدروس من 19 إلى 36 بحلول نهاية يوليو"},
    {when_en:"July", when_ar:"يوليو", what_en:"Complete the Post-intervention Survey", what_ar:"إكمال استمارة ما بعد التدخّل"}
  ];
  var CERT=[
    {en:"Complete the Pre-training Survey", ar:"إكمال استمارة ما قبل التدريب"},
    {en:"Complete all 36 lessons", ar:"إكمال جميع الدروس الـ36"},
    {en:"Complete the Post-intervention Survey", ar:"إكمال استمارة ما بعد التدخّل"}
  ];
  var TXT={
    semSub:{ar:"أكمل <b>18 نشاطًا</b> في كل فصل. اختر فصلًا لعرض أنشطته وتنزيل كل نشاط.", en:"Complete <b>18 activities</b> in each semester. Choose a semester to see its activities and download each one."},
    sem1:{ar:["الفصل الأول","سبتمبر – ديسمبر"], en:["Semester 1","September – December"]},
    sem2:{ar:["الفصل الثاني","فبراير – يوليو"], en:["Semester 2","February – July"]},
    count:{ar:"18 نشاطًا", en:"18 activities"},
    day:{ar:"يوم", en:"Day"},
    dl:{ar:"تحميل PDF", en:"Download PDF"},
    open:{ar:"فتح", en:"Open"}
  };

  var lang="ar", semester=1;
  function ar(){ return lang!=="en"; }
  function t(o){ return ar()?o.ar:o.en; }
  function esc(s){ return String(s==null?"":s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function toHtml(s){ return esc(s).split(/\n\s*\n/).map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join(''); }

  /* ---------- render ---------- */
  function applyStatic(){
    document.documentElement.lang=ar()?'ar':'en';
    document.documentElement.dir =ar()?'rtl':'ltr';
    document.querySelectorAll('[data-ar]').forEach(function(el){ el.textContent=ar()?el.getAttribute('data-ar'):el.getAttribute('data-en'); });
    document.querySelectorAll('.lang-toggle button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-lang')===(ar()?'ar':'en')); });
    document.getElementById('semSub').innerHTML = t(TXT.semSub);
    var waTop=document.getElementById('waTop');
    if(waTop){ waTop.href=URLS.ask_tilli_url; waTop.innerHTML=WA+'<span>'+esc(ar()?'اسأل تيلي على واتساب':'Ask Tilli on WhatsApp')+'</span>'; }
    var waMid=document.getElementById('waMid'); if(waMid) waMid.href=URLS.ask_tilli_url;
  }

  function renderSem(){
    var b=document.getElementById('semBtns'); b.innerHTML='';
    [1,2].forEach(function(s){
      var lbl = t(s===1?TXT.sem1:TXT.sem2);
      var el=document.createElement('button');
      el.className='sem-btn'+(semester===s?' active':''); el.type='button'; el.setAttribute('data-sem',s);
      el.innerHTML='<div class="sb-t">'+esc(lbl[0])+'</div><div class="sb-s">'+esc(lbl[1])+'</div>';
      b.appendChild(el);
    });
    document.getElementById('semCount').textContent = t(TXT.count);
    var rows = ACT.filter(function(a){ return Number(a.semester)===semester; })
                  .sort(function(x,y){ return (x.number||0)-(y.number||0); });
    var box=document.getElementById('days'); box.innerHTML='';
    rows.forEach(function(a){
      var dayN = semester===1 ? a.number : (a.number-18);
      var nm = ar()?(a.nameAr||a.nameEn):(a.nameEn||a.nameAr);
      var d=document.createElement('div'); d.className='day card';
      var lbl = esc(t(TXT.dl));
      var pdf = a.pdfUrl
        ? '<a class="pdf" href="'+esc(a.pdfUrl)+'" target="_blank" rel="noopener" download aria-label="'+lbl+'" title="'+lbl+'">'+DL+'</a>'
        : '<span class="pdf disabled" aria-label="'+lbl+'" title="'+lbl+'">'+DL+'</span>';
      d.innerHTML='<div class="badge"><div class="d">'+esc(t(TXT.day))+'</div><div class="n">'+dayN+'</div></div>'+
                  '<div class="nm">'+esc(nm)+'</div>'+pdf;
      box.appendChild(d);
    });
  }

  function renderTimeline(){
    var tl=document.getElementById('timeline'); tl.innerHTML='';
    STAGES.forEach(function(s){
      var goal = s.goal_en ? '<div class="goal"><span class="flag">🎯</span><span>'+esc(ar()?s.goal_ar:s.goal_en)+'</span></div>' : '';
      var whatTxt = esc(ar()?s.what_ar:s.what_en);
      var what = s.url ? '<a href="'+esc(s.url)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--pink)">'+whatTxt+' ↗</a>' : whatTxt;
      tl.insertAdjacentHTML('beforeend','<div class="stage"><div class="stg card"><div class="when">'+esc(ar()?s.when_ar:s.when_en)+'</div><div class="what">'+what+'</div>'+goal+'</div></div>');
    });
    var cl=document.getElementById('certList'); cl.innerHTML='';
    CERT.forEach(function(c){ cl.insertAdjacentHTML('beforeend','<li><span class="tick">✓</span><span>'+esc(ar()?c.ar:c.en)+'</span></li>'); });
  }

  function renderFaq(){
    var root=document.getElementById('faq'); root.innerHTML='';
    var list=FAQS.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
    list.forEach(function(f,i){
      var q = ar()?(f.qAr||f.qEn):(f.qEn||f.qAr);
      var a = ar()?(f.aAr||f.aEn):(f.aEn||f.aAr);
      var extra='';
      if(f.widget==='teacherGuide'){
        extra='<p><a class="a-link" href="'+esc(URLS.teacher_guide_url)+'" target="_blank" rel="noopener">'+(ar()?'افتح دليل المعلّم ↗':'Open the Teacher Guide ↗')+'</a></p>';
      } else if(f.widget==='askTilli'){
        extra='<div class="ask"><div class="qr" data-qr></div><div class="cap"><span class="lead">'+(ar()?'امسح الرمز أو اضغط الزر لفتح «اسأل تيلي» على واتساب':'Scan the code or tap the button to open Ask Tilli on WhatsApp')+'</span><a class="btn-y" href="'+esc(URLS.ask_tilli_url)+'" target="_blank" rel="noopener">💬 '+(ar()?'افتح «اسأل تيلي»':'Open Ask Tilli')+'</a></div></div>';
      }
      var item=document.createElement('div'); item.className='item card';
      item.innerHTML='<button class="q" type="button" aria-expanded="false"><span class="num">'+(i+1)+'</span><span class="txt">'+esc(q)+'</span><span class="chev">'+CHEV+'</span></button><div class="a"><div class="a-inner">'+toHtml(a)+extra+'</div></div>';
      root.appendChild(item);
    });
    renderQR();
  }

  function renderLinks(){
    var box=document.getElementById('links'); box.innerHTML='';
    LINKS.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }).forEach(function(l){
      var nm=ar()?(l.nameAr||l.nameEn):(l.nameEn||l.nameAr);
      var el=document.createElement('div'); el.className='lnk card';
      el.innerHTML='<span class="lnm">'+esc(nm)+'</span><a class="btn-t" href="'+esc(l.url||'#')+'" target="_blank" rel="noopener">'+UP+'<span>'+esc(t(TXT.open))+'</span></a>';
      box.appendChild(el);
    });
    var waNm = ar()?'اسأل تيلي على واتساب':'Ask Tilli on WhatsApp';
    var wa=document.createElement('div'); wa.className='lnk card';
    wa.innerHTML='<span class="lnm">'+esc(waNm)+'</span><a class="btn-t" href="'+esc(URLS.ask_tilli_url)+'" target="_blank" rel="noopener">'+UP+'<span>'+esc(t(TXT.open))+'</span></a>';
    box.appendChild(wa);
  }

  function renderQR(){
    document.querySelectorAll('[data-qr]').forEach(function(box){
      try{ var qr=qrcode(0,'M'); qr.addData(URLS.ask_tilli_url); qr.make(); box.innerHTML=qr.createSvgTag({cellSize:4,margin:1,scalable:true}); }
      catch(e){ box.innerHTML='<div style="font:12px sans-serif;color:#5B7488;max-width:118px;word-break:break-all">'+esc(URLS.ask_tilli_url)+'</div>'; }
    });
  }

  function renderAll(){ applyStatic(); renderSem(); renderTimeline(); renderFaq(); renderLinks(); postHeight(); }

  /* ---------- interactions ---------- */
  document.querySelector('.lang-toggle').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    lang=b.getAttribute('data-lang'); try{localStorage.setItem('tilliLang',lang);}catch(err){}
    renderAll();
  });
  document.getElementById('semBtns').addEventListener('click',function(e){
    var b=e.target.closest('.sem-btn'); if(!b) return;
    semester=Number(b.getAttribute('data-sem')); renderSem(); postHeight();
  });
  document.getElementById('faq').addEventListener('click',function(e){
    var btn=e.target.closest('.q'); if(!btn) return;
    var item=btn.parentElement, a=item.querySelector('.a');
    if(item.classList.contains('open')){ item.classList.remove('open'); btn.setAttribute('aria-expanded','false'); a.style.maxHeight=null; }
    else{ item.classList.add('open'); btn.setAttribute('aria-expanded','true'); a.style.maxHeight=a.scrollHeight+'px'; }
    setTimeout(postHeight,320);
  });
  function fixOpen(){ document.querySelectorAll('.item.open .a').forEach(function(a){a.style.maxHeight=a.scrollHeight+'px';}); }
  window.addEventListener('resize',function(){ fixOpen(); postHeight(); });

  /* ---------- height report (so a host page can auto-resize the iframe) ----------
     On the HOST page, to auto-size the iframe, add:
       <script>window.addEventListener('message',function(e){
         if(e.data&&e.data.type==='tilliHeight'){ document.getElementById('tilliFrame').style.height=e.data.height+'px'; }
       });<\/script>
     (give your <iframe id="tilliFrame"> ) */
  function postHeight(){ try{ parent.postMessage({type:'tilliHeight', height:Math.ceil(document.body.scrollHeight)},'*'); }catch(e){} }

  /* ---------- language persistence (per browser) ---------- */
  try{ var s=localStorage.getItem('tilliLang'); if(s==='en'||s==='ar') lang=s; }catch(e){}
  window.addEventListener('storage',function(e){ if(e.key==='tilliLang'&&(e.newValue==='en'||e.newValue==='ar')){ lang=e.newValue; renderAll(); } });
  // Optional: a host page can switch language via postMessage({type:'setLang', lang:'en'|'ar'})
  window.addEventListener('message',function(e){
    var d=e.data||{};
    if(d.type==='setLang'&&(d.lang==='en'||d.lang==='ar')){ lang=d.lang; renderAll(); }
  });

  renderAll();
})();
</script>
</body>
</html>
